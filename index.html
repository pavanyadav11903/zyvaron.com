<!DOCTYPE html>
<html>
<head>
<title>Zyvaron Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {margin:0; font-family:Arial; background:#eaeded;}

/* AMAZON HEADER */
header {
  background:#131921;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h2 {
  margin:0;
  color:#ff9900;
}

.search-box input {
  padding:8px;
  width:300px;
  border:none;
}

/* PRODUCTS */
.products {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  padding:20px;
}

.card {
  background:white;
  width:220px;
  margin:15px;
  padding:15px;
  border-radius:8px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
  text-align:center;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.05);
}

.card img {
  width:100%;
  height:180px;
  object-fit:cover;
}

/* AMAZON BUTTON */
button {
  background:#ffd814;
  border:1px solid #fcd200;
  padding:10px;
  margin-top:10px;
  cursor:pointer;
  font-weight:bold;
}

/* FOOTER */
footer {
  background:#232f3e;
  color:white;
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<header>
  <h2>Zyvaron</h2>

    <input type="text" placeholder="Search Amazon products...">
  </div>

<style>
body {margin:0; font-family:Arial; background:#f1f3f6;}

header {
  background:#2874f0;
  color:white;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.search-box input {
  padding:8px;
  width:250px;

  display:flex;

.card {

  box-shadow:0 0 5px gray;
  text-align:center;
}

.card img {
  width:100%;
  height:180px;
  object-fit:cover;
}

button {
  background:#fb641b;
  color:white;
  border:none;
  padding:10px;

}

footer {

  text-align:center;
  padding:20px;

#welcomeBox {

  justify-content:center;
  align-items:center;
  z-index:999;
}

.welcome-content {
  background:white;
  padding:25px;

  text-align:center;
  width:300px;
}

.welcome-content button {
  margin-top:10px;
  padding:10px;

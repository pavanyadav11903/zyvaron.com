<!DOCTYPE html>
<html>
<head>
<title>Zyvaron Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {margin:0; font-family:Arial; background:#eaeded;}

/* HEADER */
header {
  background:#131921;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h2 {color:#ff9900; margin:0;}

.search-box input {
  padding:8px;
  width:300px;
  border:none;
}

/* BANNER */
.banner {
  width:100%;
  height:250px;
  background:url('https://images.unsplash.com/photo-1607082349566-187342175e2f') center/cover;
}

/* CATEGORIES */
.categories {
  display:flex;
  justify-content:center;
  background:white;
  padding:15px;
  gap:20px;
}

.categories div {
  background:#f3f3f3;
  padding:10px 20px;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

.categories div:hover {
  background:#ffd814;
}

/* PRODUCTS */
.products {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  padding:20px;
}

.card {
  background:white;
  width:220px;
  margin:15px;
  padding:15px;
  border-radius:8px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
  text-align:center;
}

.card img {
  width:100%;
  height:180px;
  object-fit:cover;
}

button {
  background:#ffd814;
  border:1px solid #fcd200;
  padding:10px;
  margin-top:10px;
  cursor:pointer;
  font-weight:bold;
}

/* FOOTER */
footer {
  background:#232f3e;
  color:white;
  text-align:center;
  padding:20px;
}

/* WELCOME POPUP */
#welcomeBox {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.welcome-content {
  background:white;
  padding:25px;
  border-radius:10px;
  text-align:center;
  width:300px;
}

.welcome-content button {
  margin-top:10px;
  padding:10px;
  background:#ff9900;
  color:white;
  border:none;
}
</style>
</head>

<body>

<!-- WELCOME POPUP -->
<div id="welcomeBox">
  <div class="welcome-content">
    <h2>Welcome to Zyvaron 🛒</h2>
    <p>Best Amazon Deals for You</p>
    <button onclick="closeWelcome()">Enter Store</button>
  </div>
</div>

<header>
  <h2>Zyvaron</h2>
  <div class="search-box">
    <input type="text" id="search" placeholder="Search products..." onkeyup="searchProducts()">
  </div>
</header>

<div class="banner"></div>

<div class="categories">
  <div onclick="filterProducts('all')">All</div>
  <div onclick="filterProducts('mobile')">Mobiles</div>
  <div onclick="filterProducts('laptop')">Laptops</div>
  <div onclick="filterProducts('headphone')">Headphones</div>
</div>

<div class="products">

<div class="card mobile">
  <img src="https://m.media-amazon.com/images/I/616-Eh2FbPL._SL1500_.jpg">
  <h3>iPhone 17 Pro Max</h3>
  <p>₹1,49,900</p>
  <a href="https://www.amazon.in/dp/B0FQFW4MVJ/?tag=zyvaronstore-21" target="_blank">
    <button>Buy Now</button>
  </a>
</div>

<div class="card mobile">
  <img src="https://m.media-amazon.com/images/I/31MWL1qkA+L._SX342_SY445_QL70_FMwebp_.jpg">
  <h3>iPhone Air</h3>
  <p>₹93,499</p>
  <a href="https://www.amazon.in/dp/B0FQFJGP8S/?tag=zyvaronstore-21" target="_blank">
    <button>Buy Now</button>
  </a>
</div>

<div class="card headphone">
  <img src="https://m.media-amazon.com/images/I/61oCISLE+PL._SL1500_.jpg">
  <h3>Apple AirPods</h3>
  <p>₹11,999</p>
  <a href="https://www.amazon.in/dp/B0DGJLL7V1/?tag=zyvaronstore-21" target="_blank">
    <button>Buy Now</button>
  </a>
</div>

</div>

<footer>
  <p>Email: zyvaron.co.in@gmail.com</p>
  <p>Phone: +916360669149</p>
  <p>This site uses affiliate links</p>
</footer>

<script>
function closeWelcome(){
  document.getElementById("welcomeBox").style.display="none";
}

function filterProducts(category){
  let cards = document.getElementsByClassName("card");

  for(let i=0;i<cards.length;i++){
    if(category === "all"){
      cards[i].style.display = "block";
    } else {
      cards[i].style.display = cards[i].classList.contains(category) ? "block" : "none";
    }
  }
}

function searchProducts(){
  let input = document.getElementById("search").value.toLowerCase();
  let cards = document.getElementsByClassName("card");

  for(let i=0;i<cards.length;i++){
    let text = cards[i].innerText.toLowerCase();
    cards[i].style.display = text.includes(input) ? "block" : "none";
  }
}
</script>

</body>
</html>

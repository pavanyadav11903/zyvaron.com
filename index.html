<!DOCTYPE html>
<html>
<head>
    <title>Pavan Store</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }
        h1 {
            background: black;
            color: white;
            padding: 15px;
        }
        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        .card {
            background: white;
            padding: 15px;
            margin: 15px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
        img {
            width: 100%;
            border-radius: 10px;
        }
        button {
            padding: 10px;
            background: green;
            color: white;
            border: none;
            margin-top: 10px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<h1>🛒 Pavan Online Store</h1>

<div class="products">

<div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Samsung Phone</h3>
    <p>₹14,999</p>
    <a href="https://www.amazon.in" target="_blank">
        <button>Buy Now</button>
    </a>
</div>

<div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Headphones</h3>
    <p>₹1,999</p>
    <a href="https://www.amazon.in" target="_blank">
        <button>Buy Now</button>
    </a>
</div>

<div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Laptop</h3>
    <p>₹45,000</p>
    <a href="https://www.amazon.in" target="_blank">
        <button>Buy Now</button>
    </a>
</div>

</div>

</body>
</html>
